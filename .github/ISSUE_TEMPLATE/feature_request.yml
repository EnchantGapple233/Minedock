name: "功能建议 / Feature request"
description: "说明使用场景和希望改善的问题 / Describe a use case and the problem to improve"
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        使用问题请到 [Discussions](https://github.com/EnchantGapple233/Minedock/discussions)。
        Please use Discussions for usage questions. Chinese or English is welcome.
  - type: checkboxes
    id: checks
    attributes:
      label: "提交前检查 / Before submitting"
      options:
        - label: "我已搜索已有建议并阅读当前功能范围 / I searched existing requests and checked the current scope"
          required: true
  - type: textarea
    id: problem
    attributes:
      label: "使用场景与问题 / Use case and problem"
      description: "谁在什么操作中遇到了什么困难？Who encounters what difficulty, during which workflow?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "希望的行为 / Proposed behavior"
      description: "说明具体输入、操作与结果。Describe concrete inputs, actions, and results."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "现有替代方案 / Alternatives"
      description: "目前如何完成？为什么仍需要此功能？How do you handle this today, and what remains difficult?"
  - type: textarea
    id: context
    attributes:
      label: "补充信息 / Additional context"
      description: "可附示意图或公开资料链接，请勿包含敏感信息。Optional mockups or public references; exclude sensitive information."
